
name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ./JoshHack
        run: chmod +x ./mvnw

      - name: Run JUnit regression tests
        working-directory: ./JoshHack
        run: ./mvnw clean test

      - name: Run PIT mutation testing
        working-directory: ./JoshHack
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Run SpotBugs static analysis
        working-directory: ./JoshHack
        run: ./mvnw test-compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: JoshHack/target/spotbugs/spotbugs.sarif
          category: spotbugs

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joshhack-pit-report
          path: JoshHack/target/pit-reports/
          if-no-files-found: ignore
